name: Build Tags Database

on:
  repository_dispatch:
    types: [upstream_updated]

  schedule:
    - cron: '0 0 * * *'

  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install requests

      - name: Run build script
        env:
          UPSTREAM_API_URL: ${{ secrets.UPSTREAM_API_URL }}
          UPSTREAM_API_TOKEN: ${{ secrets.UPSTREAM_API_TOKEN }}
        run: |
          python scripts/build.py

      - name: Commit and push if changed
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update tags.json [skip ci]"
          file_pattern: "data/tags.json"